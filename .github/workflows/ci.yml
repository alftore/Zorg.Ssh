name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Zorg.Ssh.slnx -c Release

      # ZORG_REQUIRE_PEERS=1 turns a missing ssh or ssh-keygen into a failure, so the OpenSSH tests can't pass by skipping.
      # The interop suite needs a Linux container engine, which windows-latest doesn't have, so it has its own job.
      - name: Test
        env:
          ZORG_REQUIRE_PEERS: '1'
        run: dotnet test --project tests/Zorg.Ssh.Tests -c Release --no-build

      - name: Pack
        shell: bash
        run: dotnet pack src/Zorg.Ssh/Zorg.Ssh.csproj -c Release --no-build -p:PackageOutputPath="$RUNNER_TEMP/packages"

  # The package targets net10.0, but an app on .NET 11 runs it on the .NET 11 runtime. This builds with the SDK from
  # global.json, then runs the same tests with DOTNET_ROLL_FORWARD=LatestMajor. It's set on the test executable only,
  # not on the dotnet CLI, so the SDK itself stays on its own runtime. RuntimeVersionTests fails if the roll-forward
  # didn't happen.
  dotnet11:
    name: Test on the .NET 11 runtime (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 11.0.x

      - name: Build
        run: dotnet build tests/Zorg.Ssh.Tests -c Release

      - name: Test
        env:
          ZORG_REQUIRE_PEERS: '1'
          ZORG_EXPECT_DOTNET_MAJOR: '11'
          DOTNET_ROLL_FORWARD: LatestMajor
        run: |
          dotnet --list-runtimes
          tests/Zorg.Ssh.Tests/bin/Release/net10.0/Zorg.Ssh.Tests

  # Manual only: Actions > CI > Run workflow. macOS minutes cost several times Linux ones on a private repository.
  # Once the repository is public, standard runners are free: consider moving macos-latest into the matrix above and
  # deleting this job. It's the only place the macOS code (lstat and stat layouts in LocalFile) runs.
  # The tests use macOS's own ssh and ssh-keygen. CI=true is set by GitHub, so a missing tool fails, as on the other runners.
  macos:
    name: Build and test (macos-latest)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Zorg.Ssh.slnx -c Release

      - name: Test
        run: dotnet test --project tests/Zorg.Ssh.Tests -c Release --no-build

  interop:
    name: Interop tests (ubuntu-latest, Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Check the peers
        run: |
          docker version
          ssh -V
          command -v ssh-keygen sftp ssh-agent ssh-add

      - name: Build
        run: dotnet build tests/Zorg.Ssh.InteropTests -c Release

      # Docker is the engine here. ZORG_REQUIRE_PEERS=1 makes a missing docker, ssh or sftp a failure, not a skip.
      - name: Test
        env:
          ZORG_REQUIRE_PEERS: '1'
          ZORG_SSH_CONTAINER_CLI: docker
        run: dotnet test --project tests/Zorg.Ssh.InteropTests -c Release --no-build

  aot-smoke:
    name: AOT smoke publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install Native AOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      # The explicit shell turns on pipefail, so a failed publish isn't hidden by tee.
      # BouncyCastle isn't marked AOT-compatible, so this publish and run are the gate, not a build flag.
      - name: Publish
        shell: bash
        run: |
          dotnet publish samples/Zorg.Ssh.AotSmoke -r linux-x64 -c Release -o "$RUNNER_TEMP/aot" | tee "$RUNNER_TEMP/publish.log"
          if grep -E '\bIL[23][0-9]{3}\b' "$RUNNER_TEMP/publish.log"; then
            echo "::error::The publish reported trim or AOT warnings."
            exit 1
          fi

      - name: Run
        shell: bash
        run: '"$RUNNER_TEMP/aot/Zorg.Ssh.AotSmoke"'
